[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-wellbeing-qa"
version = "0.1.0"
description = "Quality and safety evaluation portfolio project for an AI wellbeing assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
